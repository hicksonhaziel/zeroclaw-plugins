[package]
name = "realms-vote-build"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Policy-controlled unsigned SPL Governance vote builder"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mandate-core = { path = "../../crates/mandate-core" }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "=0.22.1"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = "0.5.1"
